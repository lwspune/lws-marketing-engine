<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Maths question story card</title>
<!-- One 1080×1920 story card at a time. stories/render.mjs calls renderCard(day, part) and screenshots it.
     Maths is set by KaTeX (stories/vendor/katex, the same version pyqvault.com uses), text in Cambria. -->
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<style>
  /* Reel.WHITE (reels/engine.js): soft board, white card, navy ink, one green accent. */
  :root { --board: #faf8f3; --edge: #f1ede4; --ink: #23304a; --muted: #5f6880; --green: #2a736e; --green-soft: #e3efed; --line: #e4e0d6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--board); }
  /* Instagram's own buttons cover roughly the top and bottom 250 px, so everything sits between them. */
  #card { width: 1080px; height: 1920px; color: var(--ink); font-family: Cambria, "Cambria Math", serif;
    background: radial-gradient(ellipse at 50% 40%, var(--board) 55%, var(--edge) 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 56px; padding: 260px 72px; }
  .sheet { width: 100%; background: #fff; border-radius: 44px; padding: 72px 64px; box-shadow: 0 18px 48px rgba(35, 48, 74, .10);
    display: flex; flex-direction: column; gap: 44px; }
  .kicker { align-self: flex-start; background: var(--green); color: #fff; font: 700 44px "Segoe UI", sans-serif;
    padding: 12px 34px; border-radius: 999px; letter-spacing: .5px; }
  .q { line-height: 1.42; overflow-wrap: anywhere; }
  .q.small { color: var(--muted); }
  .opts { display: flex; flex-direction: column; gap: 24px; }
  .opt { display: flex; align-items: center; gap: 30px; border: 3px solid var(--line); border-radius: 28px; padding: 22px 30px; min-height: 112px; }
  .opt .l { flex: none; width: 68px; height: 68px; border-radius: 50%; border: 3px solid var(--ink); display: flex; align-items: center;
    justify-content: center; font: 700 38px "Segoe UI", sans-serif; }
  .opt .t { min-width: 0; line-height: 1.3; overflow-wrap: anywhere; }
  .opt.right { border-color: var(--green); background: var(--green-soft); }
  .opt.right .l { background: var(--green); border-color: var(--green); color: #fff; }
  .opt.faded { opacity: .45; }
  .step { border-top: 3px solid var(--line); padding-top: 36px; line-height: 1.4; overflow-wrap: anywhere; }
  .step b { font: 700 .82em "Segoe UI", sans-serif; color: var(--green); margin-right: 14px; }
  .cta { font: 700 50px "Segoe UI", sans-serif; color: var(--ink); display: flex; align-items: center; gap: 22px; }
  .cta.quiet { font-weight: 600; font-size: 42px; color: var(--muted); }
  .cta svg { width: 56px; height: 56px; color: var(--green); flex: none; }
  /* The answer card repeats the question small and adds the reason, so it packs tighter. */
  .answer .sheet { gap: 34px; padding: 60px 56px; }
  .answer .opts { gap: 16px; }
  .answer .opt { min-height: 92px; padding: 14px 28px; }
  .katex { font-size: 1.06em; }
  .katex-display { margin: .3em 0; }
</style>
</head>
<body>
<div id="card"></div>
<script src="vendor/katex/katex.min.js"></script>
<script src="questions.js"></script>
<script>
"use strict";
const Q = window.StoryQuestions;
const card = document.getElementById("card");
const REPLY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z" fill="currentColor"/></svg>';

function el(tag, cls, parent) { const e = document.createElement(tag); if (cls) e.className = cls; if (parent) parent.appendChild(e); return e; }

// Text goes in as text nodes; maths through KaTeX (which builds its own DOM). Nothing is parsed as HTML.
function rich(parent, text, errors) {
  for (const s of Q.segments(text)) {
    if (!s.math) { parent.appendChild(document.createTextNode(s.text)); continue; }
    const span = el("span", "", parent);
    try { katex.render(s.tex, span, { displayMode: s.display, throwOnError: true }); }
    catch (e) { errors.push(`maths "${s.tex.slice(0, 40)}": ${e.message}`); span.textContent = s.tex; }
  }
  return parent;
}

function build(day, part, sizes, errors) {
  const t = Q.cardText(day, part);
  card.replaceChildren();
  card.className = part;
  const sheet = el("div", "sheet", card);
  if (t.kicker) el("div", "kicker", sheet).textContent = t.kicker;
  const q = rich(el("p", part === "answer" ? "q small" : "q", sheet), t.question, errors);
  q.style.fontSize = (part === "answer" ? sizes.q * 0.72 : sizes.q) + "px";
  const opts = el("div", "opts", sheet);
  for (const o of t.options) {
    const row = el("div", "opt" + (part === "answer" ? (o.label === t.correct ? " right" : " faded") : ""), opts);
    el("span", "l", row).textContent = o.label;
    rich(el("span", "t", row), o.text, errors).style.fontSize = sizes.o + "px";
  }
  if (part === "answer") {
    const step = el("p", "step", sheet);
    step.style.fontSize = sizes.s + "px";
    el("b", "", step).textContent = "Why";
    rich(step, t.step, errors);
  }
  const cta = el("p", part === "answer" ? "cta quiet" : "cta", card);
  if (part === "question") cta.insertAdjacentHTML("afterbegin", REPLY); // fixed icon markup, no user text
  cta.appendChild(document.createTextNode(t.cta));
}

// Whatever spills past the card or the safe zone, as readable problems.
function spills() {
  const out = [];
  const box = card.getBoundingClientRect();
  const first = card.firstElementChild.getBoundingClientRect(), last = card.lastElementChild.getBoundingClientRect();
  if (first.top < 250 || last.bottom > 1920 - 250) out.push(`too tall for the story safe zone (${Math.round(last.bottom - first.top)} px)`);
  // Where each formula ends vs the card's inner edge (KaTeX's tall fractions fool scrollWidth).
  const sheet = card.querySelector(".sheet");
  const right = sheet.getBoundingClientRect().right - parseFloat(getComputedStyle(sheet).paddingRight);
  for (const e of card.querySelectorAll(".katex")) {
    if (e.getBoundingClientRect().right > right + 2) out.push(`maths "${e.textContent.slice(0, 30)}" runs past the card`);
  }
  if (box.width > 1080) out.push("card wider than the story");
  return out;
}

// Largest sizes that fit; returns the problems still left at the smallest sizes ([] = good card).
window.renderCard = async (day, part) => {
  for (let k = 0; k <= 10; k++) {
    const f = 1 - k * 0.05;
    const errors = [];
    build(day, part, { q: Math.round(58 * f), o: Math.round(52 * f), s: Math.round(46 * f) }, errors);
    await document.fonts.ready;
    if (errors.length) return errors;
    const s = spills();
    if (!s.length || k === 10) return s;
  }
};

window.reelReady = document.fonts.ready.then(() => true);
</script>
</body>
</html>
