<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel 004 V Explains</title>
<link rel="stylesheet" href="render.css">
</head>
<body>
<canvas id="c" aria-label="Reel preview"></canvas>
<div class="bar" id="bar"></div>
<div id="status" role="status"></div>
<script src="engine.js"></script>
<script>
// Reel 004 (v2, white "visual" format, 2026-10-15) — V explains NDA 2026 (II) Maths Q13:
// sin(tan⁻¹ 0.75) = 3/5. θ = tan⁻¹(3/4) is in (0, π/2) since 0.75 > 0, so tan θ = 3/4 → a right
// triangle with opposite 3, adjacent 4, hypotenuse 5 → sin θ = 3/5 (c). Trap: 4/5 is cos θ.
// The triangle is drawn true to 3 : 4 : 5 (honest scale). V speaks in soft white cards (no voice).
// v1 (paper + pen) is kept as nda-maths-004-v-paper.mp4; this page replaces its source.
const { blue: BLUE, green: GREEN, fill: FILL, ink: INK, muted: MUTED } = Reel.WHITE;
const lerp = (a, b, k) => a + (b - a) * k;

// Right angle at B. 1 unit = 130 px, so the sides are exactly 3 : 4 : 5.
const U = 130, A = [250, 1130], B = [250 + 4 * U, 1130], C = [250 + 4 * U, 1130 - 3 * U];

// ---- question card: full for the hook, then a slim strip ----------------------------------
function drawQuestionCard(ctx, t, api) {
  const k = api.prog(t, 3.0, 0.8);
  api.card(110, lerp(460, 410, k), 860, lerp(340, 252, k));
  ctx.save(); ctx.fillStyle = MUTED; ctx.font = `600 34px ${api.SOFT_UI}`; ctx.textAlign = 'center';
  ctx.fillText('NDA 2026 (II)  ·  Maths  ·  Q13', 540, lerp(520, 458, k)); ctx.restore();
  api.math([{ text: 'sin(tan', color: BLUE }, { sup: '−1', color: BLUE }, { text: ' 0.75)  =  ?', color: BLUE }],
    { y: lerp(640, 548, k), size: Math.round(lerp(64, 58, k)), cx: 540 });
  api.chips(t, { labels: ['(a) 1', '(b) 4/5', '(c) 3/5', '(d) 1/2'], y: lerp(700, 584, k), answer: 2, at: ANSWER,
    size: Math.round(lerp(40, 36, k)), w: lerp(182, 166, k), h: lerp(72, 58, k), gap: 14 });
}

// ---- the triangle ---------------------------------------------------------------------------
const SIDES = [
  { from: A, to: B, t0: 8.2, dur: 1.0, label: '4', at: [(A[0] + B[0]) / 2, B[1] + 62] },          // adjacent
  { from: B, to: C, t0: 9.4, dur: 0.8, label: '3', at: [B[0] + 46, (B[1] + C[1]) / 2 + 18] },     // opposite
  { from: C, to: A, t0: 12.4, dur: 1.0, label: '5', at: [(A[0] + C[0]) / 2 - 44, (A[1] + C[1]) / 2 - 16] }, // hypotenuse
];
const SIN_AT = 16.4, TRAP_AT = 23.8, ANSWER = 20.6;

function side(ctx, api, s, color, width = 6, dash) {
  const p = new Path2D(); p.moveTo(...s.from); p.lineTo(...s.to);
  ctx.save(); if (dash) ctx.setLineDash(dash); api.softStroke(p, color, width); ctx.restore();
}

function drawTriangle(ctx, t, api) {
  // Fill the triangle softly once sin is being read off it.
  const f = api.prog(t, SIN_AT, 0.8);
  if (f > 0) {
    ctx.save(); ctx.globalAlpha = f; ctx.fillStyle = FILL;
    ctx.beginPath(); ctx.moveTo(...A); ctx.lineTo(...B); ctx.lineTo(...C); ctx.closePath(); ctx.fill(); ctx.restore();
  }
  for (const s of SIDES) {
    const p = api.prog(t, s.t0, s.dur); if (p <= 0) continue;
    const end = [lerp(s.from[0], s.to[0], p), lerp(s.from[1], s.to[1], p)];
    side(ctx, api, { from: s.from, to: end }, BLUE);
    if (p < 1) { // a calm leading dot, not a pen
      ctx.save(); ctx.fillStyle = BLUE; ctx.shadowColor = BLUE; ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.arc(end[0], end[1], 9, 0, 7); ctx.fill(); ctx.restore();
    }
    const a = api.prog(t, s.t0 + s.dur, 0.4);
    if (a > 0) {
      ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = INK; ctx.font = api.hand(56); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(s.label, ...s.at); ctx.restore();
    }
  }
  // Right-angle mark at B, θ arc at A.
  const r = api.prog(t, 10.2, 0.4);
  if (r > 0) {
    ctx.save(); ctx.globalAlpha = r; ctx.strokeStyle = MUTED; ctx.lineWidth = 3;
    ctx.strokeRect(B[0] - 30, B[1] - 30, 30, 30); ctx.restore();
  }
  const th = api.prog(t, 10.5, 0.6);
  if (th > 0) {
    const ang = Math.atan2(C[1] - A[1], C[0] - A[0]);
    ctx.save(); ctx.strokeStyle = BLUE; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(A[0], A[1], 74, 0, ang * th, true); ctx.stroke();
    ctx.globalAlpha = th; ctx.fillStyle = BLUE; ctx.font = api.hand(46); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('θ', A[0] + 92, A[1] - 26); ctx.restore();
  }
  // sin beat: the two sides sin uses turn green (with their labels, so colour isn't the only cue).
  if (f > 0) {
    const fade = 1 - api.prog(t, TRAP_AT, 0.5);
    ctx.save(); ctx.globalAlpha = f * fade;
    side(ctx, api, SIDES[1], GREEN, 9); side(ctx, api, SIDES[2], GREEN, 9);
    ctx.fillStyle = GREEN; ctx.font = `600 36px ${api.SOFT_UI}`; ctx.textAlign = 'center';
    ctx.fillText('opposite', B[0] + 80, (B[1] + C[1]) / 2 - 36);
    ctx.save(); ctx.translate((A[0] + C[0]) / 2 - 70, (A[1] + C[1]) / 2 - 64); ctx.rotate(Math.atan2(C[1] - A[1], C[0] - A[0]));
    ctx.fillText('hypotenuse', 0, 0); ctx.restore();
    ctx.restore();
  }
  // Trap beat: the adjacent side turns dashed + muted (never the answer's colour); the working line
  // under it says "cos θ = 4/5 ≠ sin θ", so the cue isn't colour alone.
  const tr = api.prog(t, TRAP_AT, 0.6) * (1 - api.prog(t, END_AT - 0.2, 0.3));
  if (tr > 0) {
    ctx.save(); ctx.globalAlpha = tr; side(ctx, api, SIDES[0], MUTED, 9, [16, 12]); ctx.restore();
  }
}

// ---- working, one line at a time, under the triangle ---------------------------------------
function drawWorking(ctx, t, api) {
  const steps = [
    [3.8, 7.8, ['θ = tan', { sup: '−1' }, '(3/4)   ⇒   tan θ = ', { text: '3/4', color: BLUE }], 52],
    [13.6, 16.2, ['hyp = √(3', { sup: '2' }, ' + 4', { sup: '2' }, ')  =  √25  =  ', { text: '5', color: BLUE }], 52],
    [16.6, 23.4, ['sin θ  =  opp ÷ hyp  =  ', { text: '3/5', color: GREEN }], 56],
    [23.9, 27.0, [{ text: 'cos θ = 4/5', color: MUTED }, '   ≠   sin θ'], 52],
  ];
  for (const [t0, t1, tokens, size] of steps) {
    const a = api.prog(t, t0, 0.5) * (1 - api.prog(t, t1, 0.4)); if (a <= 0) continue;
    ctx.save(); ctx.globalAlpha = a; api.math(tokens, { y: 1290, size, cx: 540 }); ctx.restore();
  }
}

// ---- V: pose + a soft white speech card (no border, no voice) ------------------------------
const V = { x: 36, y: 1352, w: 230 };
const SAYS = [
  { t0: 3.4,  t1: 7.8,  pose: 'talk',  text: 'Call the angle θ.\nThen tan θ = 0.75 = 3/4.' },
  { t0: 7.8,  t1: 12.0, pose: 'talk',  text: 'tan = opposite ÷ adjacent.\nSo draw it: 3 up, 4 across.' },
  { t0: 12.0, t1: 16.2, pose: 'think', text: 'The hypotenuse?\nIt\'s a 3-4-5 triangle: 5.' },
  { t0: 16.2, t1: 20.4, pose: 'talk',  text: 'sin = opposite ÷ hypotenuse\n= 3/5' },
  { t0: 20.4, t1: 23.6, pose: 'laugh', text: '' },
  { t0: 23.6, t1: 27.4, pose: 'think', text: 'Careful: 4/5 is cos θ,\nnot sin θ.' },
];
const END_AT = 27.4;

function speech(ctx, api, text, alpha, h) {
  if (!text || alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.font = `600 42px ${api.SOFT_UI}`;
  const x = V.x + V.w + 22, w = 640, lines = api.wrap(text, w - 70), lh = 54, bh = lines.length * lh + 52, y = V.y + 6;
  api.card(x, y, w, bh, 30, 0.12);
  // Tail: a small white wedge towards V's face.
  ctx.fillStyle = '#ffffff'; ctx.beginPath();
  ctx.moveTo(x + 2, y + 44); ctx.lineTo(V.x + V.w - 18, V.y + h * 0.42); ctx.lineTo(x + 2, y + 92); ctx.closePath(); ctx.fill();
  ctx.fillStyle = INK; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  lines.forEach((l, i) => ctx.fillText(l, x + 36, y + 28 + i * lh));
  ctx.restore();
}

function drawV(ctx, t, api, isCover) {
  if (isCover || t >= END_AT) return;
  const say = SAYS.find(s => t >= s.t0 && t < s.t1);
  const pose = say?.pose ?? 'think';
  const im = api.img(pose); if (!im) return;
  const h = V.w * im.height / im.width, talking = pose === 'talk';
  const bob = Math.sin(t * 2.2) * 6, squash = talking ? 1 + 0.02 * Math.sin(t * 12) : 1;
  ctx.drawImage(im, V.x, V.y + bob - h * (squash - 1), V.w, h * squash);
  if (say) speech(ctx, api, say.text, api.clamp01((t - say.t0) / 0.25) * (1 - api.prog(t, say.t1 - 0.25, 0.25)), h);
}

Reel.mount({
  name: 'nda-maths-004-v',
  theme: 'white',
  size: [1080, 1920],
  duration: 31.0,
  watermarkY: null,
  images: { think: 'assets/v-think.png', talk: 'assets/v-talk.png', laugh: 'assets/v-laugh.png' },
  captions: [
    { t0: 0,    t1: 3.2,  text: 'Inverse trig looks scary.\nIt\'s just a triangle.' },
    { t0: 20.4, t1: 23.6, text: 'Answer: (c) 3/5' },
  ],
  lines: [],
  draw(ctx, t, api, isCover) {
    drawQuestionCard(ctx, t, api);
    drawTriangle(ctx, t, api);
    drawWorking(ctx, t, api);
    drawV(ctx, t, api, isCover);
    return null;
  },
  end: { t0: END_AT, y: 960, image: 'laugh', lines: [
    { at: 0.3, size: 50, weight: 400, color: MUTED, text: 'Inverse trig? Draw the triangle.' },
    { at: 0.6, size: 62, weight: 600, color: INK, text: 'Then read sin off it.' },
    { at: 1.3, size: 80, weight: 700, color: GREEN, text: 'Follow for more' },
  ] },
  music: { chime: ANSWER },
  cover: { t: 17.4, text: 'Inverse trig?\nDraw the triangle.', y: 1440, size: 70 },
});
</script>
</body>
</html>
