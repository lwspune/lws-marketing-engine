<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Visualised 1 Collision</title>
<link rel="stylesheet" href="render.css">
</head>
<body>
<canvas id="c" aria-label="Reel preview"></canvas>
<div class="bar" id="bar"></div>
<div id="status" role="status"></div>
<script src="engine.js"></script>
<script>
// @pyqvault_ · "Physics, visualised #1: why does the moving ball stop dead?" (2026-10-18). Class 11–12.
// Two equal 1 kg balls, A at 4 m/s into B at rest, elastic. A soft-contact model (velocities change along a
// half cosine while the balls squash) so the energy bars show KE → "squash" → KE, and the live totals stay
// at p = 4 kg·m/s, E = 8 J. Then the why: after the collision (vA, vB) must lie on the momentum line
// vA + vB = 4 AND the energy circle vA² + vB² = 16: only (4, 0) "before" and (0, 4) "after".
// Payoff: the real JEE Main 2022 (27 June) Physics Q8: KE passed to a ball 5× heavier = 4·1·5/6² = 55.5% (c).
// THEME is the background A/B test on @pyqvault_ (learnings L22): this one is 'lab' (dark).
const THEME = 'lab';
const PAL = Reel.palette(THEME);
const { blue: BLUE, green: GREEN, ink: INK, muted: MUTED } = PAL;
const lerp = (a, b, k) => a + (b - a) * k;
const show = (api, t, t0, t1, f = 0.35) => api.prog(t, t0, f) * (1 - api.prog(t, t1 - f, f));
const tint = (hex, a) => `rgba(${[1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)).join(', ')}, ${a})`;

const GRAPH0 = 14.2, PAY0 = 25.0, ANSWER = 33.4, END_AT = 37.0;
const PX = 40;                                    // px per (m/s · s): 4 m/s = 160 px/s

// One head-on collision of A (mass m, speed u m/s) into B (mass M, at rest). slow = 2 plays it at half speed.
// Returns positions (px) and velocities (m/s) at time t. During contact (tau, real seconds) the relative
// velocity turns along u·cos φ, φ: 0 → π, so momentum is conserved exactly and kinetic energy dips into
// the squash and comes back (elastic).
function collide(t, { t0, m, M, u, xA0, xB0, rA, rB, slow = 1, tau = 0.4 }) {
  const s = PX / slow, gap0 = xB0 - xA0 - rA - rB, tc = t0 + gap0 / (u * s), T = tau * slow;
  const vcm = m * u / (m + M), kA = M / (m + M), kB = m / (m + M);
  if (t < t0) return { xA: xA0, xB: xB0, vA: 0, vB: 0, contact: 0 };
  if (t < tc) return { xA: xA0 + u * s * (t - t0), xB: xB0, vA: u, vB: 0, contact: 0 };
  const xAc = xB0 - rA - rB;
  const d = Math.min(t - tc, T), phi = Math.PI * d / T;
  const vA = vcm + kA * u * Math.cos(phi), vB = vcm - kB * u * Math.cos(phi);
  const xA = xAc + s * (vcm * d + kA * u * (T / Math.PI) * Math.sin(phi)), xB = xB0 + s * (vcm * d - kB * u * (T / Math.PI) * Math.sin(phi));
  if (t <= tc + T) return { xA, xB, vA, vB, contact: Math.sin(phi) };
  const after = t - tc - T;
  return { xA: xA + vA * s * after, xB: xB + vB * s * after, vA, vB, contact: 0 };
}
const energy = (m, M, st, u) => {
  const ka = 0.5 * m * st.vA ** 2, kb = 0.5 * M * st.vB ** 2, total = 0.5 * m * u * u;
  return { ka, kb, squash: Math.max(0, total - ka - kb), total };
};

// Scene 1: two runs, the second in slow motion.
const RUNS = [{ t0: 4.4, slow: 1 }, { t0: 9.0, slow: 2 }];
const EQUAL = { m: 1, M: 1, u: 4, xA0: 190, xB0: 600, rA: 50, rB: 50 };
function runAt(t) { return t < RUNS[1].t0 - 0.2 ? RUNS[0] : RUNS[1]; }

// ---- title: held still on a card with a light running round its edge, then it glides up ----
const TITLE_CARD = { x: 80, y: 620, w: 920, h: 360 };
function drawTitle(ctx, t, api) {
  const k = api.prog(t, 2.6, 1.0), ca = 1 - api.prog(t, 2.5, 0.5);
  if (ca > 0) {
    ctx.save(); ctx.globalAlpha = ca; api.card(TITLE_CARD.x, TITLE_CARD.y, TITLE_CARD.w, TITLE_CARD.h); ctx.restore();
    api.glowRing(t, { ...TITLE_CARD, t0: 0, dur: 2.8, laps: 1.25, alpha: ca });
  }
  const s = lerp(1, 0.72, k), cy = lerp(847, 350, k);   // 847: the title block (label + 2 lines) centred on the card
  ctx.save(); ctx.translate(540, cy); ctx.scale(s, s);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = MUTED; ctx.font = `700 46px ${api.SOFT_UI}`; ctx.fillText('PHYSICS, VISUALISED  #1', 0, -150);
  ctx.fillStyle = INK; ctx.font = api.hand(78);
  ctx.fillText('Why does the moving', 0, -60); ctx.fillText('ball stop dead?', 0, 40);
  ctx.restore();
}

// ---- drawing helpers ----
function ball(ctx, x, y, r, color, label, api) {
  ctx.save(); ctx.fillStyle = color; ctx.shadowColor = tint(color, 0.45); ctx.shadowBlur = 24;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
  ctx.save(); ctx.fillStyle = THEME === 'lab' ? '#0a0e15' : '#ffffff'; ctx.font = `700 ${Math.round(r * 0.62)}px ${api.SOFT_UI}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, x, y + 2); ctx.restore();
}
function arrow(ctx, x, y, len, color) {
  if (Math.abs(len) < 8) return;
  const d = Math.sign(len);
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len - d * 14, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + len, y); ctx.lineTo(x + len - d * 22, y - 12); ctx.lineTo(x + len - d * 22, y + 12); ctx.closePath(); ctx.fill();
  ctx.restore();
}
// Vertical energy bars with a value on top: [{ label, value, color }], scaled to `full`.
function bars(ctx, api, items, { x0, gap, base, h, full, w = 110 }) {
  items.forEach((b, i) => {
    const x = x0 + i * gap, hh = h * Math.min(1, b.value / full);
    ctx.save();
    ctx.fillStyle = tint(INK, 0.06); ctx.beginPath(); ctx.roundRect(x - w / 2, base - h, w, h, 12); ctx.fill();
    ctx.fillStyle = b.color; ctx.beginPath(); ctx.roundRect(x - w / 2, base - hh, w, Math.max(hh, 0.01), 12); ctx.fill();
    ctx.fillStyle = INK; ctx.font = api.hand(36); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.value.toFixed(1) + ' J', x, base - hh - 26);
    ctx.fillStyle = MUTED; ctx.font = `600 34px ${api.SOFT_UI}`; ctx.fillText(b.label, x, base + 34);
    ctx.restore();
  });
}

// ---- scene 1: the collision, live ----
const TRACK = 880;
function drawScene1(ctx, t, api, isCover) {
  const a = api.prog(t, 3.4, 0.6) * (1 - api.prog(t, GRAPH0 - 0.5, 0.5)); if (a <= 0) return;
  const run = runAt(t), st = collide(t, { ...EQUAL, ...run }), en = energy(1, 1, st, 4);
  ctx.save(); ctx.globalAlpha = a;
  ctx.strokeStyle = PAL.axis; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(80, TRACK); ctx.lineTo(1000, TRACK); ctx.stroke();
  if (run.slow > 1 && t > run.t0 - 0.2) {
    ctx.fillStyle = MUTED; ctx.font = `600 34px ${api.SOFT_UI}`; ctx.textAlign = 'left'; ctx.fillText('slow motion ×½', 90, 650);
  }
  const yA = TRACK - EQUAL.rA, yB = TRACK - EQUAL.rB;
  ball(ctx, Math.min(st.xA, 1100), yA, EQUAL.rA, BLUE, 'A', api);
  ball(ctx, Math.min(st.xB, 1100), yB, EQUAL.rB, GREEN, 'B', api);
  arrow(ctx, st.xA, yA - 80, st.vA * 22, BLUE); arrow(ctx, st.xB, yB - 80, st.vB * 22, GREEN);
  bars(ctx, api, [
    { label: 'A', value: en.ka, color: BLUE }, { label: 'squash', value: en.squash, color: tint(MUTED, 0.8) }, { label: 'B', value: en.kb, color: GREEN },
  ], { x0: 330, gap: 210, base: 1240, h: 230, full: 8 });
  if (!isCover) {
    api.math([{ text: 'vA = ' + st.vA.toFixed(1), color: BLUE }, '     ', { text: 'vB = ' + st.vB.toFixed(1), color: GREEN }, '   m/s'], { y: 1352, size: 44, cx: 540, color: INK });
    api.math(['momentum  ', { text: (st.vA + st.vB).toFixed(1) + ' kg·m/s' }, '   ·   energy  ', { text: en.total.toFixed(1) + ' J' }], { y: 1430, size: 42, cx: 540, color: INK });
  }
  ctx.restore();
}

// ---- scene 2: why, as a picture ----
const G = { cx: 470, cy: 1000, s: 64 };
const gp = (vA, vB) => [G.cx + vA * G.s, G.cy - vB * G.s];
function drawScene2(ctx, t, api) {
  const a = api.prog(t, GRAPH0, 0.6) * (1 - api.prog(t, PAY0 - 0.6, 0.6)); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  ctx.strokeStyle = PAL.axis; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(...gp(-5, 0)); ctx.lineTo(...gp(5.4, 0)); ctx.moveTo(...gp(0, -5)); ctx.lineTo(...gp(0, 5.4)); ctx.stroke();
  ctx.fillStyle = BLUE; ctx.font = api.hand(40); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('vA', gp(5.4, 0)[0] + 14, G.cy - 34);
  ctx.fillStyle = GREEN; ctx.textAlign = 'center'; ctx.fillText('vB', G.cx, gp(0, 5.4)[1] - 30);
  // momentum line vA + vB = 4, drawn in
  const l = api.prog(t, GRAPH0 + 1.0, 1.4);
  if (l > 0) {
    const p0 = gp(-1, 5), p1 = gp(5, -1);
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(...p0); ctx.lineTo(lerp(p0[0], p1[0], l), lerp(p0[1], p1[1], l)); ctx.stroke();
  }
  // energy circle vA² + vB² = 16, traced
  const c = api.prog(t, GRAPH0 + 3.2, 1.6);
  if (c > 0) {
    ctx.strokeStyle = tint(PAL.green, 0.95); ctx.lineWidth = 5; ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(G.cx, G.cy, 4 * G.s, 0, -2 * Math.PI * c, true); ctx.stroke();
  }
  // the only two answers
  const d = api.prog(t, GRAPH0 + 5.4, 0.6);
  if (d > 0) {
    const pulse = 1 + 0.25 * Math.sin(Math.PI * api.clamp01((t - GRAPH0 - 5.4) / 0.8));
    for (const [vA, vB, label, dx, dy] of [[4, 0, 'before (4, 0)', -40, 54], [0, 4, 'after (0, 4)', 26, -40]]) {
      const [x, y] = gp(vA, vB);
      ctx.globalAlpha = a * d; ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(x, y, 14 * pulse, 0, 7); ctx.fill();
      ctx.font = api.hand(40); ctx.textAlign = 'left'; ctx.fillText(label, x + dx, y + dy);
    }
  }
  ctx.restore();
}

// ---- words ----
function drawWords(ctx, t, api, isCover) {
  if (isCover) return;
  const say = (a, tokens, y, size, color = INK) => { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; api.math(tokens, { y, size, cx: 540, color }); ctx.restore(); };
  say(show(api, t, 3.6, 6.7), ['two equal balls: ', { text: 'A', color: BLUE }, ' at 4 m/s, ', { text: 'B', color: GREEN }, ' at rest'], 1530, 46);
  say(show(api, t, 6.9, 8.8), [{ text: 'A', color: BLUE }, ' stops dead. ', { text: 'B', color: GREEN }, ' takes all of it.'], 1530, 48);
  say(show(api, t, 9.0, GRAPH0 - 0.3), ['the energy squeezes in… and comes back out'], 1530, 44);
  say(show(api, t, GRAPH0 + 0.4, GRAPH0 + 3.0), ['after the hit, both rules must hold:'], 1440, 46);
  say(show(api, t, GRAPH0 + 1.2, GRAPH0 + 5.2), ['momentum:  vA + vB = 4'], 1520, 50);
  say(show(api, t, GRAPH0 + 3.2, GRAPH0 + 5.2), [{ text: 'energy:  vA² + vB² = 16', color: GREEN }], 1440, 50);
  say(show(api, t, GRAPH0 + 5.4, PAY0 - 0.3), ['line meets circle at only two points'], 1440, 46);
  say(show(api, t, GRAPH0 + 7.0, PAY0 - 0.3), ['equal balls can only ', { text: 'swap speeds', color: GREEN }], 1520, 50);
}

// ---- payoff: the real JEE Main question, run live ----
const CARD = { x: 90, y: 560, w: 900, h: 400 }, CARD_CY = CARD.y + CARD.h / 2;
const HEAVY = { m: 1, M: 5, u: 4, xA0: 150, xB0: 520, rA: 40, rB: 68 };
function drawPayoff(ctx, t, api) {
  const a = api.prog(t, PAY0, 0.6) * (1 - api.prog(t, END_AT, 0.4)); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = MUTED; ctx.font = `600 40px ${api.SOFT_UI}`; ctx.textAlign = 'center';
  ctx.fillText('JEE Main asked exactly this:', 540, 520); ctx.restore();
  const s = lerp(1.14, 1, api.prog(t, PAY0, 1.0));
  ctx.save(); ctx.globalAlpha = a; ctx.translate(540, CARD_CY); ctx.scale(s, s); ctx.translate(-540, -CARD_CY);
  api.card(CARD.x, CARD.y, CARD.w, CARD.h);
  ctx.fillStyle = MUTED; ctx.font = `600 34px ${api.SOFT_UI}`; ctx.textAlign = 'center'; ctx.fillText('JEE Main 2022 (27 June)  ·  Physics  ·  Q8', 540, 616);
  api.math(['What % of its kinetic energy goes to a ball'], { y: 686, size: 42, cx: 540, color: INK });
  api.math(['5× heavier, at rest? (head-on, elastic)'], { y: 742, size: 42, cx: 540, color: INK });
  api.chips(t, { labels: ['(a) 50.0%', '(b) 66.6%', '(c) 55.5%', '(d) 33.3%'], y: 800, answer: 2, at: ANSWER, size: 38, w: 196, h: 72, gap: 14 });
  ctx.restore();
  // the same collision with B five times heavier
  const sa = api.prog(t, PAY0 + 1.6, 0.5) * a;
  if (sa > 0) {
    const st = collide(t, { ...HEAVY, t0: PAY0 + 2.4, slow: 1.4 }), en = energy(1, 5, st, 4), y = 1150;
    ctx.save(); ctx.globalAlpha = sa;
    ctx.strokeStyle = PAL.axis; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(80, y); ctx.lineTo(1000, y); ctx.stroke();
    ball(ctx, Math.max(st.xA, -100), y - HEAVY.rA, HEAVY.rA, BLUE, '1', api);
    ball(ctx, Math.min(st.xB, 1100), y - HEAVY.rB, HEAVY.rB, GREEN, '5', api);
    arrow(ctx, st.xA, y - 2 * HEAVY.rA - 30, st.vA * 22, BLUE); arrow(ctx, st.xB, y - 2 * HEAVY.rB - 30, st.vB * 22, GREEN);
    // shares of the starting 8 J, as horizontal bars
    const row = (yy, label, v, color) => {
      const w = 600 * v / 8;
      ctx.fillStyle = tint(INK, 0.06); ctx.beginPath(); ctx.roundRect(250, yy - 22, 600, 44, 12); ctx.fill();
      ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(250, yy - 22, Math.max(w, 0.01), 44, 12); ctx.fill();
      ctx.fillStyle = MUTED; ctx.font = `600 34px ${api.SOFT_UI}`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(label, 230, yy);
      ctx.fillStyle = INK; ctx.font = api.hand(38); ctx.textAlign = 'left'; ctx.fillText((100 * v / 8).toFixed(1) + '%', 866, yy);
    };
    row(1220, 'ball 1', en.ka, BLUE); row(1286, 'ball 5', en.kb, GREEN);
    ctx.restore();
  }
  const say = (t0, tokens, y, size, color = INK) => {
    const b = api.prog(t, t0, 0.5) * a; if (b <= 0) return;
    ctx.save(); ctx.globalAlpha = b; api.math(tokens, { y, size, cx: 540, color }); ctx.restore();
  };
  say(PAY0 + 5.6, ['share passed on  =  4·m·M / (m + M)²'], 1390, 44);
  say(PAY0 + 6.8, ['=  4·1·5 / 6²  =  20/36  =  55.5%  →  (c)'], 1470, 48, GREEN);
  say(PAY0 + 9.2, ['(a) 50% assumes an even split: only equal balls pass on 100%'], 1550, 36, MUTED);
}

Reel.mount({
  name: 'pv-physics-001-collision',
  theme: THEME,
  vignette: true,
  size: [1080, 1920],
  duration: 40.4,
  watermarkY: null,
  captions: [],
  lines: [],
  draw(ctx, t, api, isCover) {
    drawTitle(ctx, t, api);
    drawScene1(ctx, t, api, isCover);
    drawScene2(ctx, t, api);
    drawWords(ctx, t, api, isCover);
    drawPayoff(ctx, t, api);
    return null;
  },
  end: { t0: END_AT, y: 860, lines: [
    { at: 0.2, size: 48, weight: 400, color: MUTED, text: 'Equal balls swap speeds.' },
    { at: 0.5, size: 64, weight: 600, color: INK, text: 'That\'s the physics.' },
    { at: 1.1, size: 70, weight: 700, color: GREEN, text: 'Follow for #2' },
  ] },
  music: { style: 'bright', chime: ANSWER },
  // Cover: mid-squash in slow motion, the energy bars split.
  cover: { t: 13.27, text: 'Why the moving ball stops dead', y: 1520, size: 56 },
});
</script>
</body>
</html>
