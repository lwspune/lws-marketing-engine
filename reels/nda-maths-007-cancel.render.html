<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel 007 Areas Cancel</title>
<link rel="stylesheet" href="render.css">
</head>
<body>
<canvas id="c" aria-label="Reel preview"></canvas>
<div class="bar" id="bar"></div>
<div id="status" role="status"></div>
<script src="engine.js"></script>
<script>
// Reel 007 — white "visual" format. NDA 2024 (I) Maths Q74: ∫₋₁¹ (3 sin x − sin 3x) cos²x dx = 0.
// sin 3x = 3 sin x − 4 sin³x, so the integrand is 4 sin³x cos²x: odd (sin³ odd × cos² even). Over the
// symmetric interval [−1, 1] the area above the axis equals the area below: they cancel, 0 (b).
// The graph is the real function on the real interval (honest scale), y stretched for legibility.
const { blue: BLUE, green: GREEN, fill: FILL, grid: GRID, axis: AXIS, ink: INK, muted: MUTED } = Reel.WHITE;
const lerp = (a, b, k) => a + (b - a) * k;

// Graph: x in [−1, 1] maps onto OX ± SX; y up by SY per unit; origin (OX, GY).
// GY and SY grow as the question card shrinks after the hook (set each frame by setView).
const OX = 540, SX = 380;
let GY = 1130, SY = 300;
function setView(t, api) { const k = api.prog(t, 3.0, 0.8); GY = lerp(1130, 1080, k); SY = lerp(300, 400, k); }
const px = x => OX + x * SX, py = y => GY - y * SY;
const g = x => 4 * Math.pow(Math.sin(x), 3) * Math.pow(Math.cos(x), 2);

function halfRegion(sign) { // the region between the curve and the axis on [0, 1] (sign 1) or [−1, 0] (sign −1)
  const p = new Path2D(); p.moveTo(OX, GY);
  for (let i = 0; i <= 80; i++) { const x = sign * i / 80; p.lineTo(px(x), py(g(x))); }
  p.lineTo(px(sign), GY); p.closePath();
  return p;
}

function drawAxes(ctx, api) {
  ctx.save();
  ctx.fillStyle = GRID;
  for (let i = -4; i <= 4; i++) for (let j = -3; j <= 3; j++) {
    if (i === 0 || j === 0) continue;
    ctx.beginPath(); ctx.arc(px(i / 4), py(j / 4), 2.6, 0, 7); ctx.fill();
  }
  ctx.strokeStyle = AXIS; ctx.fillStyle = AXIS; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(px(-1) - 50, GY); ctx.lineTo(px(1) + 40, GY); ctx.moveTo(OX, GY + 0.85 * SY); ctx.lineTo(OX, GY - 0.85 * SY + 10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(px(1) + 52, GY); ctx.lineTo(px(1) + 34, GY - 9); ctx.lineTo(px(1) + 34, GY + 9); ctx.fill();
  const top = GY - 0.85 * SY;
  ctx.beginPath(); ctx.moveTo(OX, top - 2); ctx.lineTo(OX - 9, top + 16); ctx.lineTo(OX + 9, top + 16); ctx.fill();
  ctx.font = api.hand(36); ctx.textAlign = 'center';
  ctx.fillText('x', px(1) + 44, GY - 24); ctx.fillText('y', OX + 30, top + 24);
  ctx.fillStyle = MUTED;
  for (const x of [-1, 1]) {
    ctx.fillText(x < 0 ? '−1' : '1', px(x), x < 0 ? GY - 22 : GY + 52);
    ctx.strokeStyle = AXIS; ctx.beginPath(); ctx.moveTo(px(x), GY - 9); ctx.lineTo(px(x), GY + 9); ctx.stroke();
  }
  ctx.fillText('O', OX - 30, GY + 46);
  ctx.restore();
}

function drawCurve(ctx, t, api) {
  const p = api.prog(t, 7.2, 3.0); if (p <= 0) return;
  const end = -1 + 2 * p, path = new Path2D();
  for (let i = 0; i <= 300; i++) { const x = -1 + (end + 1) * i / 300; i ? path.lineTo(px(x), py(g(x))) : path.moveTo(px(x), py(g(x))); }
  api.softStroke(path, BLUE, 6);
  if (p < 1) {
    ctx.save(); ctx.fillStyle = BLUE; ctx.shadowColor = BLUE; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(px(end), py(g(end)), 9, 0, 7); ctx.fill(); ctx.restore();
  }
  ctx.save(); ctx.globalAlpha = api.prog(t, 7.4, 0.5);
  api.math([{ text: 'y = 4 sin³x cos²x', color: BLUE }], { y: 860, size: 40, x: 120 });
  ctx.restore();
}

// Right half fills green (+A); a copy turns half a circle about O and lands on the left half (−A, hatched).
const FILL_R = 11.0, TURN0 = 12.2, TURN = 2.0, LAND = 14.2, FADE = 16.6;
function drawAreas(ctx, t, api) {
  const keep = 1 - 0.7 * api.prog(t, FADE, 1.0);
  const r = api.prog(t, FILL_R, 0.6) * keep;
  if (r > 0) {
    ctx.save(); ctx.globalAlpha = r; ctx.fillStyle = FILL; ctx.fill(halfRegion(1));
    ctx.fillStyle = GREEN; ctx.font = `700 46px ${api.SOFT_UI}`; ctx.textAlign = 'center'; ctx.fillText('+A', px(0.62), py(0.22));
    ctx.restore();
  }
  // The turning copy: right half rotated by π·k about O.
  const k = api.prog(t, TURN0, TURN), copy = (t >= TURN0 ? 1 : 0) * (1 - api.prog(t, LAND, 0.6));
  if (copy > 0) {
    ctx.save(); ctx.translate(OX, GY); ctx.rotate(Math.PI * k); ctx.translate(-OX, -GY);
    ctx.globalAlpha = copy * 0.9; ctx.fillStyle = FILL; ctx.fill(halfRegion(1));
    ctx.strokeStyle = GREEN; ctx.lineWidth = 3; ctx.setLineDash([10, 8]); ctx.stroke(halfRegion(1));
    ctx.restore();
    // A quiet arc around O shows the turn.
    ctx.save(); ctx.globalAlpha = copy; ctx.strokeStyle = MUTED; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(OX, GY, 70, -0.15, -0.15 - Math.PI * k, true); ctx.stroke(); ctx.restore();
  }
  // The landed left half: hatched and dashed (not just a colour), labelled −A.
  const l = api.prog(t, LAND, 0.6) * keep;
  if (l > 0) {
    const left = halfRegion(-1);
    ctx.save(); ctx.globalAlpha = l;
    ctx.save(); ctx.clip(left); ctx.globalAlpha = l * 0.4; ctx.strokeStyle = MUTED; ctx.lineWidth = 2;
    for (let x = px(-1) - 400; x < OX; x += 16) { ctx.beginPath(); ctx.moveTo(x, GY + 400); ctx.lineTo(x + 400, GY); ctx.stroke(); }
    ctx.restore();
    ctx.setLineDash([12, 9]); ctx.strokeStyle = MUTED; ctx.lineWidth = 3.5; ctx.stroke(left); ctx.setLineDash([]);
    ctx.fillStyle = MUTED; ctx.font = `700 46px ${api.SOFT_UI}`; ctx.textAlign = 'center'; ctx.fillText('−A', px(-0.62), py(-0.22) + 30);
    ctx.restore();
  }
}

function drawWorking(ctx, t, api) {
  const steps = [
    [3.6, 7.0, ['3 sin x − sin 3x  =  ', { text: '4 sin³x', color: BLUE }], 56],
    [15.0, 21.4, [{ text: '(+A)', color: GREEN }, '  +  ', { text: '(−A)', color: MUTED }, '  =  ', { text: '0', color: GREEN }], 64],
    [21.8, 25.0, ['odd function on [−1, 1]  ⇒  ', { text: '0', color: GREEN }], 52],
  ];
  for (const [t0, t1, tokens, size] of steps) {
    const a = api.prog(t, t0, 0.5) * (1 - api.prog(t, t1, 0.4)); if (a <= 0) continue;
    ctx.save(); ctx.globalAlpha = a; api.math(tokens, { y: 1530, size, cx: 540 }); ctx.restore();
  }
}

// Full question card for the hook, then it shrinks to a slim strip so the graph is the focal point.
function drawQuestionCard(ctx, t, api) {
  const k = api.prog(t, 3.0, 0.8);
  api.card(110, lerp(460, 410, k), 860, lerp(340, 252, k));
  ctx.save(); ctx.fillStyle = MUTED; ctx.font = `600 34px ${api.SOFT_UI}`; ctx.textAlign = 'center';
  ctx.fillText('NDA 2024 (I)  ·  Maths  ·  Q74', 540, lerp(520, 458, k)); ctx.restore();
  api.math([{ int: ['−1', '1'], color: BLUE }, { text: ' (3 sin x − sin 3x) cos²x dx', color: BLUE }], { y: lerp(640, 548, k), size: Math.round(lerp(60, 56, k)), cx: 540 });
  api.chips(t, { labels: ['(a) −¼', '(b) 0', '(c) ½', '(d) ¼'], y: lerp(700, 584, k), answer: 1, at: 18.2,
    size: Math.round(lerp(40, 36, k)), w: lerp(182, 166, k), h: lerp(72, 58, k), gap: 14 });
}

Reel.mount({
  name: 'nda-maths-007-cancel',
  theme: 'white',
  size: [1080, 1920],
  duration: 28.0,
  watermarkY: null,
  captions: [
    { t0: 0,    t1: 3.2,  text: 'Three lines of integration?\nOr one picture.' },
    { t0: 3.2,  t1: 7.0,  text: 'Simplify first:\nsin 3x = 3 sin x − 4 sin³x' },
    { t0: 7.0,  t1: 10.8, text: 'Now graph it,\nfrom −1 to 1.' },
    { t0: 10.8, t1: 14.6, text: 'Turn the right half about O:\nit lands on the left.' },
    { t0: 14.6, t1: 18.0, text: 'Above = below.\nThey cancel to 0.' },
    { t0: 18.0, t1: 21.6, text: 'Answer: (b) 0' },
    { t0: 21.6, t1: 25.0, text: 'Got −¼, ½ or ¼?\nThat\'s a slip in the long way.' },
  ],
  lines: [],
  draw(ctx, t, api) {
    setView(t, api);
    drawQuestionCard(ctx, t, api);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 670, api.W, 830); ctx.clip();
    drawAxes(ctx, api);
    drawAreas(ctx, t, api);
    drawCurve(ctx, t, api);
    ctx.restore();
    drawWorking(ctx, t, api);
    return null;
  },
  end: { t0: 25.0, lines: [
    { at: 0.3, size: 50, weight: 400, color: MUTED, text: 'Odd function, limits −a to a?' },
    { at: 0.6, size: 62, weight: 600, color: INK, text: 'The answer is 0.' },
    { at: 1.3, size: 80, weight: 700, color: GREEN, text: 'Follow for more' },
  ] },
  music: { chime: 18.2 },
  cover: { t: 14.8, text: 'Above cancels below.\nThe answer is 0.', y: 1520, size: 70 },
});
</script>
</body>
</html>
