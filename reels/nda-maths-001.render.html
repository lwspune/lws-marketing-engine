<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel 001 Render</title>
<style>
  :root { --bg: #111; --fg: #ddd; --accent: #4fd1a5; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px ui-monospace, Consolas, monospace;
         display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  canvas { height: 80vh; max-width: 100%; aspect-ratio: 9 / 16; border: 1px solid #333; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; background: #1d1d1d; color: var(--fg); border: 1px solid #444; padding: 8px 14px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { min-height: 1.4em; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920" aria-label="Reel preview"></canvas>
<div class="bar">
  <button id="play">Play preview (with music)</button>
  <button id="rec">Record &amp; download MP4</button>
  <button id="cover">Download cover PNG</button>
</div>
<div id="status" role="status"></div>
<script>
// ---------------------------------------------------------------------------
// Reel 001 — NDA 2026 (II) Maths Q74: ∫₁² xˣ(1 + ln x) dx = 3. See nda-maths-001.md.
// Everything is drawn on a 1080×1920 canvas; Edge records it to H.264 MP4.
// ---------------------------------------------------------------------------
const W = 1080, H = 1920, DURATION = 33;
const INK = '#1b2a6b', RED = '#d22f27', PAPER = '#fbf8f0';
// Cambria over handwriting fonts: legible at phone size, and "ln" can't be misread as "In".
const HAND = 'Cambria, "Cambria Math", serif';
const MATH = '"Cambria Math", "Segoe UI Symbol", serif';
const UI = '"Segoe UI", system-ui, sans-serif';

// Captions: the on-screen text, one per beat.
const CAPTIONS = [
  { t0: 0,    t1: 3,    text: 'NDA 2026 asked this\nlast month.' },
  { t0: 3,    t1: 6,    text: "Looks impossible?\nDon't integrate it." },
  { t0: 6,    t1: 12.5, text: 'Ask: whose derivative is this?' },
  { t0: 12.5, t1: 18,   text: "That's the whole integrand." },
  { t0: 18,   t1: 24,   text: 'Just put in the limits.' },
  { t0: 24,   t1: 28,   text: 'Answer: (b) 3\nCareful: 1¹ = 1, not 0' },
];

// Handwritten lines. Tokens: string | {sup} | {sub} | {int:[lo,hi]} | {limits:[lo,hi]} | {mark:name}.
// t0 < 0 means already on the page at the start (the question is pre-written).
const LINES = [
  { y: 455, size: 44, t0: -1, dur: 0, color: RED, tokens: ['NDA 2026 (II)  ·  Maths  ·  Q74'] },
  { y: 590, size: 92, t0: -1, dur: 0, tokens: [{ int: ['1', '2'] }, ' ', { mark: 'uStart' }, 'x', { sup: 'x' }, '(1 + ln x)', { mark: 'uEnd' }, ' dx = ?'] },
  { y: 715, size: 66, t0: -1, dur: 0, tokens: ['(a) 4    ', { mark: 'bStart' }, '(b) 3', { mark: 'bEnd' }, '    (c) 2    (d) 1'] },
  { y: 870,  size: 78, t0: 6.3,  dur: 1.5, tokens: ['Let  y = x', { sup: 'x' }] },
  { y: 985,  size: 78, t0: 8.0,  dur: 1.6, tokens: ['ln y = x ln x'] },
  { y: 1100, size: 78, t0: 9.9,  dur: 2.1, tokens: ['y′ / y = ln x + 1'] },
  { y: 1230, size: 82, t0: 12.6, dur: 2.0, tokens: [{ mark: 'boxStart' }, 'y′ = x', { sup: 'x' }, '(1 + ln x)', { mark: 'boxEnd' }] },
  { y: 1370, size: 78, t0: 18.3, dur: 2.0, tokens: ['∴  ', { int: ['1', '2'] }, ' y′ dx = [ x', { sup: 'x' }, ' ]', { limits: ['1', '2'] }] },
  { y: 1490, size: 78, t0: 20.6, dur: 2.6, tokens: ['= 2', { sup: '2' }, ' − 1', { sup: '1' }, ' = 4 − 1 = ', { mark: 'ansStart' }, '3', { mark: 'ansEnd' }] },
];
const LEFT = 150;

// Red-pen annotations, drawn after layout from the marks above.
const NOTES = [
  { t0: 3.3,  dur: 1.2, kind: 'underline', from: 'uStart', to: 'uEnd' },
  { t0: 14.8, dur: 1.0, kind: 'box', from: 'boxStart', to: 'boxEnd' },
  { t0: 16.0, dur: 1.4, kind: 'arrow', from: 'boxEnd', to: 'uEnd' },
  { t0: 23.4, dur: 0.6, kind: 'ring', from: 'ansStart', to: 'ansEnd' },
  { t0: 24.2, dur: 1.0, kind: 'ring', from: 'bStart', to: 'bEnd' },
];

const END = { t0: 28, lines: [
  { at: 0.2, size: 50, weight: 400, color: '#cfd8e3', text: 'See (1 + ln x) next to something?' },
  { at: 0.5, size: 62, weight: 700, color: '#ffffff', text: 'Check for a derivative first.' },
  { at: 1.4, size: 84, weight: 800, color: '#4fd1a5', text: 'Follow @lwspune' },
] };

// ---------------------------------------------------------------------------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp01 = v => Math.max(0, Math.min(1, v));
const ease = p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const prog = (t, t0, dur) => dur <= 0 ? (t >= t0 ? 1 : 0) : ease(clamp01((t - t0) / dur));

function hand(size) { return `600 ${size}px ${HAND}`; }

// Lay out one line: returns drawable items (with x offsets) and named marks.
function layout(line) {
  const s = line.size, items = [], marks = {};
  let x = line.x ?? LEFT;
  for (const tk of line.tokens) {
    if (typeof tk === 'string') {
      ctx.font = hand(s); const w = ctx.measureText(tk).width;
      items.push({ x, dy: 0, font: hand(s), text: tk }); x += w;
    } else if (tk.sup || tk.sub) {
      const fs = Math.round(s * 0.6); ctx.font = hand(fs); const txt = tk.sup ?? tk.sub;
      items.push({ x: x + 2, dy: tk.sup ? -s * 0.45 : s * 0.2, font: hand(fs), text: txt });
      x += ctx.measureText(txt).width + 6;
    } else if (tk.int) {
      const fs = Math.round(s * 1.35); ctx.font = `${fs}px ${MATH}`; const iw = ctx.measureText('∫').width;
      items.push({ x, dy: s * 0.12, font: `${fs}px ${MATH}`, text: '∫' });
      const ls = Math.round(s * 0.5); ctx.font = hand(ls);
      const lw = Math.max(ctx.measureText(tk.int[0]).width, ctx.measureText(tk.int[1]).width);
      items.push({ x: x + iw * 0.7, dy: -s * 0.78, font: hand(ls), text: tk.int[1] });
      items.push({ x: x + iw * 0.45, dy: s * 0.4, font: hand(ls), text: tk.int[0] });
      x += iw * 0.7 + lw + 8;
    } else if (tk.limits) {
      const ls = Math.round(s * 0.5); ctx.font = hand(ls);
      items.push({ x: x + 2, dy: -s * 0.62, font: hand(ls), text: tk.limits[1] });
      items.push({ x: x + 2, dy: s * 0.28, font: hand(ls), text: tk.limits[0] });
      x += Math.max(ctx.measureText(tk.limits[0]).width, ctx.measureText(tk.limits[1]).width) + 6;
    } else if (tk.mark) {
      marks[tk.mark] = { x, y: line.y, size: s };
    }
  }
  return { items, marks, x0: line.x ?? LEFT, x1: x };
}

let LAID, MARKS;
function prepare() {
  MARKS = {};
  LAID = LINES.map(l => { const L = layout(l); Object.assign(MARKS, L.marks); return { ...l, ...L }; });
}

function paper() {
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(70, 110, 190, 0.16)'; ctx.lineWidth = 2;
  for (let y = 495; y < 1640; y += 120) { ctx.beginPath(); ctx.moveTo(0, y + 20); ctx.lineTo(W, y + 20); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(210, 47, 39, 0.28)';
  ctx.beginPath(); ctx.moveTo(110, 400); ctx.lineTo(110, H); ctx.stroke();
  ctx.fillStyle = 'rgba(27, 42, 107, 0.45)'; ctx.font = `600 34px ${UI}`; ctx.textAlign = 'left';
  ctx.fillText('LWS Pune  ·  NDA Maths', LEFT, 1600);
}

function drawPen(x, y) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.95);
  ctx.fillStyle = '#2b2b2b'; ctx.fillRect(18, -11, 300, 22);
  ctx.fillStyle = '#c9a227'; ctx.fillRect(250, -11, 14, 22);
  ctx.fillStyle = '#555'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(20, -11); ctx.lineTo(20, 11); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawLine(L, t) {
  const p = L.t0 < 0 ? 1 : prog(t, L.t0, L.dur);
  if (p <= 0) return null;
  ctx.save();
  if (p < 1) { ctx.beginPath(); ctx.rect(L.x0 - 20, L.y - L.size * 1.6, (L.x1 - L.x0 + 20) * p + 20, L.size * 2.6); ctx.clip(); }
  ctx.fillStyle = L.color ?? INK; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  for (const it of L.items) { ctx.font = it.font; ctx.fillText(it.text, it.x, L.y + it.dy); }
  ctx.restore();
  return p < 1 ? { x: L.x0 + (L.x1 - L.x0) * p, y: L.y - L.size * 0.25 } : null;
}

// Red pen: polyline revealed by progress p, with a slight hand wobble.
function strokePartial(pts, p, width = 7) {
  if (p <= 0) return null;
  let total = 0; const seg = [];
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); total += d; }
  let left = total * p, end = pts[0];
  ctx.save(); ctx.strokeStyle = RED; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(...pts[0]);
  for (let i = 1; i < pts.length && left > 0; i++) {
    const f = Math.min(1, left / seg[i - 1]);
    end = [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f];
    ctx.lineTo(...end); left -= seg[i - 1];
  }
  ctx.stroke(); ctx.restore();
  return end;
}
const wob = (i, a = 3) => Math.sin(i * 1.7) * a;

// Sample a polyline whose inner corners are rounded with radius r (quadratic curves at each corner).
function roundedPath(corners, r) {
  const pts = [corners[0]], lerp = (p, q, f) => [p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f];
  for (let i = 1; i < corners.length - 1; i++) {
    const [p, c, n] = [corners[i - 1], corners[i], corners[i + 1]];
    const a = lerp(c, p, Math.min(0.5, r / Math.hypot(p[0] - c[0], p[1] - c[1])));
    const b = lerp(c, n, Math.min(0.5, r / Math.hypot(n[0] - c[0], n[1] - c[1])));
    for (let k = 0; k <= 8; k++) { const u = k / 8, v = 1 - u; pts.push([v * v * a[0] + 2 * v * u * c[0] + u * u * b[0], v * v * a[1] + 2 * v * u * c[1] + u * u * b[1]]); }
  }
  // Densify the final leg so the arrowhead direction (taken from the last few points) is exact.
  const last = pts.at(-1), end = corners.at(-1);
  for (let k = 1; k <= 6; k++) pts.push(lerp(last, end, k / 6));
  return pts;
}

function notePath(n) {
  const a = MARKS[n.from], b = MARKS[n.to];
  if (n.kind === 'underline') {
    const y = a.y + a.size * 0.32, pts = [];
    for (let i = 0; i <= 20; i++) pts.push([a.x + (b.x - a.x) * i / 20, y + wob(i, 2.5)]);
    return pts;
  }
  if (n.kind === 'box') {
    const x0 = a.x - 22, x1 = b.x + 22, y0 = a.y - a.size * 1.0, y1 = a.y + a.size * 0.38;
    return [[x0, y0], [x1, y0 + 4], [x1 - 3, y1], [x0 + 2, y1 - 3], [x0, y0 - 6]];
  }
  if (n.kind === 'ring') {
    const cx = (a.x + b.x) / 2, cy = a.y - a.size * 0.3, rx = (b.x - a.x) / 2 + 30, ry = a.size * 0.78, pts = [];
    for (let i = 0; i <= 48; i++) { const th = -Math.PI / 2 + i / 48 * Math.PI * 2.12; pts.push([cx + Math.cos(th) * (rx + wob(i, 3)), cy + Math.sin(th) * (ry + wob(i, 2))]); }
    return pts;
  }
  if (n.kind === 'arrow') {
    // A rounded bracket: right to the page edge, straight up, then left along the gap under the
    // question to the underline's end. Every leg runs through empty space, so it crosses no text.
    const s = [a.x + 36, a.y - a.size * 0.35], e = [b.x + 14, b.y + b.size * 0.32], gx = W - 45, r = 40;
    return roundedPath([s, [gx, s[1]], [gx, e[1]], e], r);
  }
}

function drawNote(n, t) {
  const p = prog(t, n.t0, n.dur), pts = notePath(n);
  const end = strokePartial(pts, p);
  if (n.kind === 'arrow' && p >= 1) {
    const [x1, y1] = pts.at(-1), [x0, y0] = pts.at(-4), ang = Math.atan2(y1 - y0, x1 - x0);
    ctx.save(); ctx.strokeStyle = RED; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath();
    for (const d of [2.6, -2.6]) { ctx.moveTo(x1, y1); ctx.lineTo(x1 - 34 * Math.cos(ang + d / 6), y1 - 34 * Math.sin(ang + d / 6)); }
    ctx.stroke(); ctx.restore();
  }
  return p > 0 && p < 1 ? end : null;
}

function wrap(text, maxW) {
  const out = [];
  for (const para of text.split('\n')) {
    let cur = '';
    for (const w of para.split(' ')) { const next = cur ? cur + ' ' + w : w; if (ctx.measureText(next).width > maxW && cur) { out.push(cur); cur = w; } else cur = next; }
    if (cur) out.push(cur);
  }
  return out;
}

function caption(text, alpha, size = 56, y = 300) {
  if (!text || alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.font = `800 ${size}px ${UI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const lines = wrap(text, 860), lh = size * 1.22, bw = Math.max(...lines.map(l => ctx.measureText(l).width)) + 70, bh = lines.length * lh + 44;
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; roundRect(W / 2 - bw / 2 + 6, y - bh / 2 + 8, bw, bh, 24); ctx.fill();
  ctx.fillStyle = '#111'; roundRect(W / 2 - bw / 2, y - bh / 2, bw, bh, 24); ctx.fill();
  ctx.fillStyle = '#fff';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, y - (lines.length - 1) * lh / 2 + i * lh));
  ctx.restore();
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function endCard(t) {
  const p = clamp01((t - END.t0) / 0.5);
  if (p <= 0) return;
  ctx.save(); ctx.fillStyle = `rgba(12, 16, 24, ${p})`; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let y = 820;
  for (const l of END.lines) {
    const a = clamp01((t - END.t0 - l.at) / 0.35);
    ctx.globalAlpha = a; ctx.fillStyle = l.color; ctx.font = `${l.weight} ${l.size}px ${UI}`;
    ctx.fillText(l.text, W / 2, y + (1 - a) * 18);
    y += l.size * (l.size > 70 ? 2.0 : 1.75);
  }
  ctx.restore();
}

function frame(t, coverText) {
  paper();
  let pen = null;
  for (const L of LAID) pen = drawLine(L, t) ?? pen;
  for (const n of NOTES) pen = drawNote(n, t) ?? pen;
  if (pen) drawPen(pen.x, pen.y);
  // Cover text sits mid-page: the profile grid crops reels to 3:4, cutting ~240px top and bottom.
  if (coverText) caption(coverText, 1, 92, 1080);
  else {
    const c = CAPTIONS.find(c => t >= c.t0 && t < c.t1);
    // The opening caption is fully visible on frame 0: it is the hook people see before scrolling.
    if (c) caption(c.text, c.t0 === 0 ? 1 : clamp01((t - c.t0) / 0.18));
  }
  endCard(t);
}

async function ready() {
  await Promise.all(['600 40px Cambria', `40px "Cambria Math"`, `800 40px "Segoe UI"`].map(f => document.fonts.load(f)));
  prepare();
}

// ---------------------------------------------------------------------------
// Music: an original lo-fi loop synthesised with Web Audio, so there is nothing to license.
// Am7 – Fmaj7 – Cmaj7 – G6 at 84 BPM; drums enter in bar 2, the arpeggio in bar 3;
// a chime lands when the answer is circled; fades out over the last 2.5 s.
const BPM = 84, ANSWER_CHIME = 24.2;
const CHORDS = [[57, 60, 64, 67], [53, 57, 60, 64], [55, 59, 60, 64], [55, 59, 62, 64]];
const BASS = [45, 41, 48, 43];
const hz = m => 440 * Math.pow(2, (m - 69) / 12);

function music(ac, out, t0) {
  const beat = 60 / BPM, bar = beat * 4;
  const master = ac.createGain(), tone = ac.createBiquadFilter();
  tone.type = 'lowpass'; tone.frequency.value = 2600; master.connect(tone); tone.connect(out);
  master.gain.setValueAtTime(0, t0);
  master.gain.linearRampToValueAtTime(1, t0 + 1.2);
  master.gain.setValueAtTime(1, t0 + DURATION - 2.5);
  master.gain.linearRampToValueAtTime(0, t0 + DURATION);

  const noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), nd = noise.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

  const voice = (type, f, at, len, peak, attack = 0.01, dest = master, detune = 0) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; o.detune.value = detune;
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(peak, at + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, at + len);
    o.connect(g); g.connect(dest); o.start(at); o.stop(at + len + 0.05);
  };
  // Pads hold their level for the whole bar, then release, so the chords don't fade mid-bar.
  const pad = (f, at, len, peak, dest, detune) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.value = f; o.detune.value = detune;
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(peak, at + 0.45);
    g.gain.setValueAtTime(peak, at + len - 0.35); g.gain.linearRampToValueAtTime(0, at + len);
    o.connect(g); g.connect(dest); o.start(at); o.stop(at + len + 0.05);
  };
  const hit = (at, len, peak, filterType, freq) => {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noise; f.type = filterType; f.frequency.value = freq;
    g.gain.setValueAtTime(peak, at); g.gain.exponentialRampToValueAtTime(0.0001, at + len);
    s.connect(f); f.connect(g); g.connect(master); s.start(at); s.stop(at + len + 0.05);
  };
  const kick = at => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(110, at); o.frequency.exponentialRampToValueAtTime(42, at + 0.22);
    g.gain.setValueAtTime(0.55, at); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.32);
    o.connect(g); g.connect(master); o.start(at); o.stop(at + 0.4);
  };

  const padBus = ac.createBiquadFilter(); padBus.type = 'lowpass'; padBus.frequency.value = 950; padBus.connect(master);
  for (let k = 0; k * bar < DURATION; k++) {
    const at = t0 + k * bar, chord = CHORDS[k % 4];
    for (const m of chord) for (const d of [-7, 7]) pad(hz(m), at, bar + 0.3, 0.03, padBus, d);
    for (const b of [0, 1.5, 2]) voice('sine', hz(BASS[k % 4]), at + b * beat, beat * 1.2, 0.22, 0.02);
    if (k >= 1) {
      for (const b of [0, 2, 2.5]) kick(at + b * beat);
      for (const b of [1, 3]) hit(at + b * beat, 0.18, 0.12, 'bandpass', 1800);
      for (let e = 0; e < 8; e++) hit(at + e * beat / 2, 0.05, e % 2 ? 0.03 : 0.05, 'highpass', 7000);
    }
    if (k >= 2) {
      const arp = [chord[0], chord[2], chord[3], chord[1] + 12, chord[3], chord[2], chord[1], chord[2]];
      arp.forEach((m, e) => voice('triangle', hz(m + 12), at + e * beat / 2, 0.45, 0.045));
    }
  }
  for (const [m, p] of [[84, 0.11], [91, 0.06], [96, 0.03]]) voice('sine', hz(m), t0 + ANSWER_CHIME, 1.6, p, 0.005);
}

function play(startAt = performance.now()) {
  return new Promise(res => {
    const tick = () => { const t = (performance.now() - startAt) / 1000; frame(Math.max(0, Math.min(t, DURATION))); t < DURATION ? requestAnimationFrame(tick) : res(); };
    requestAnimationFrame(tick);
  });
}

async function preview() {
  const ac = new AudioContext(); await ac.resume();
  const lead = 0.15; music(ac, ac.destination, ac.currentTime + lead);
  await play(performance.now() + lead * 1000); setTimeout(() => ac.close(), 500);
}

async function record() {
  const mimeType = 'video/mp4;codecs=avc1.640028,mp4a.40.2';
  if (!MediaRecorder.isTypeSupported(mimeType)) throw new Error('This browser cannot record H.264 + AAC MP4. Use Microsoft Edge or Chrome.');
  const ac = new AudioContext(); await ac.resume();
  const dest = ac.createMediaStreamDestination();
  const stream = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]), chunks = [];
  const rec = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 12_000_000, audioBitsPerSecond: 192_000 });
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const stopped = new Promise(r => rec.onstop = r);
  frame(0); rec.start(250);
  // Audio and picture share one start instant, slightly in the future so both are scheduled in time.
  const lead = 0.15; music(ac, dest, ac.currentTime + lead);
  await play(performance.now() + lead * 1000);
  await new Promise(r => setTimeout(r, 300)); rec.stop(); await stopped; ac.close();
  return new Blob(chunks, { type: 'video/mp4' });
}

function coverBlob() { frame(1.5, '10-SECOND\nNDA INTEGRAL'); return new Promise(r => cv.toBlob(r, 'image/png')); }

function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); }
const status = m => document.getElementById('status').textContent = m;

// Automation hook: returns base64 of the recording (used by the render script).
async function toBase64(blob) {
  const buf = new Uint8Array(await blob.arrayBuffer()); let s = '';
  for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode(...buf.subarray(i, i + 0x8000));
  return btoa(s);
}
window.renderReel = async () => toBase64(await record());
window.renderCover = async () => toBase64(await coverBlob());
window.renderFrame = t => { frame(t); return cv.toDataURL('image/png').split(',')[1]; };
window.reelReady = ready();

reelReady.then(() => frame(0));
document.getElementById('play').onclick = () => preview();
document.getElementById('rec').onclick = async () => {
  try { status('Recording… keep this tab visible for 33 seconds.'); download(await record(), 'nda-maths-001.mp4'); status('Saved nda-maths-001.mp4'); }
  catch (e) { status(e.message); }
};
document.getElementById('cover').onclick = async () => download(await coverBlob(), 'nda-maths-001-cover.png');
</script>
