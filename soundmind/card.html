<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sound Mind card</title>
<!-- One 1080×1350 slide at a time. soundmind/render.mjs calls renderSlide(post, i) and screenshots it. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Lora:ital,wght@0,400;0,500;1,400&display=block" rel="stylesheet">
<style>
  :root { --paper: #F6F1E7; --ink: #2F3A33; --soft: #5E6B62; --sage: #8FAE8B; --mark: #DCE8D3; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--paper); }
  #card { position: relative; width: 1080px; height: 1350px; color: var(--ink); background: var(--paper);
    font-family: Lora, Georgia, serif; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 150px 120px 170px; text-align: center; }
  #grain { position: absolute; inset: 0; pointer-events: none; opacity: .07; }
  .count { position: absolute; top: 64px; right: 80px; font: 400 32px Lora, serif; color: var(--soft); }
  .handle { position: absolute; bottom: 62px; left: 0; right: 0; font: 500 30px Lora, serif; color: var(--soft); letter-spacing: .5px; }
  .swipe { position: absolute; bottom: 120px; right: 90px; font: 400 40px Kalam, cursive; color: var(--soft); }
  .hand { font-family: Kalam, cursive; font-weight: 700; line-height: 1.18; }
  .serif { font-family: Lora, serif; font-weight: 400; line-height: 1.38; }
  .sub { font: italic 400 42px/1.3 Lora, serif; color: var(--soft); margin-top: 26px; }
  mark { background: linear-gradient(transparent 38%, var(--mark) 38%, var(--mark) 92%, transparent 92%); color: var(--ink);
    padding: 0 .12em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .sprig { width: 150px; height: 70px; color: var(--sage); margin: 40px auto; flex: none; }
  .art { width: 760px; height: 600px; flex: none; color: var(--ink); }
  .story-page { justify-content: flex-start; padding-top: 140px; }
  .story-page .text { margin-top: 40px; }
  .story-cover { justify-content: flex-start; padding-top: 150px; }
  .story-cover .art { margin-top: 30px; height: 640px; }
  .lesson .text { text-align: center; }
  .plane { width: 120px; height: 120px; color: var(--sage); margin-bottom: 40px; flex: none; }
  .text { width: 100%; }
</style>
</head>
<body>
<div id="card"></div>
<svg width="0" height="0" style="position:absolute">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
  <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.2  0 0 0 0 0.2  0 0 0 0 0.15  0 0 0 1 0"/></filter>
</svg>
<script src="cards.js"></script>
<script src="art.js"></script>
<script>
"use strict";
const C = window.SoundMindCards, A = window.SoundMindArt;
const NS = "http://www.w3.org/2000/svg";
const card = document.getElementById("card");

const SPRIG = '<path d="M10 40 C50 40 90 38 140 34" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>' +
  [[40, 39, -1], [70, 38, 1], [100, 36, -1]].map(([x, y, d]) =>
    `<path d="M${x} ${y} q12 ${d * 22} 34 ${d * 24} q-6 ${-d * 22} -34 ${-d * 24} Z" fill="currentColor" opacity=".85"/>`).join("");
const PLANE = '<path d="M14 58 L106 18 L74 104 L56 70 Z M56 70 L106 18" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>';

function el(tag, cls, parent) { const e = document.createElement(tag); if (cls) e.className = cls; if (parent) parent.appendChild(e); return e; }

// Text goes in as text nodes and <mark> elements only; nothing is parsed as HTML.
function richText(parent, text, cls, size) {
  const p = el("p", "text " + cls, parent);
  p.style.fontSize = size + "px";
  for (const seg of C.parseEmphasis(text)) {
    if (seg.mark) el("mark", "", p).textContent = seg.text;
    else p.appendChild(document.createTextNode(seg.text));
  }
  return p;
}

function svg(cls, viewBox, inner, parent, rough) {
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("class", cls); s.setAttribute("viewBox", viewBox);
  s.innerHTML = rough ? `<g filter="url(#rough)">${inner}</g>` : inner;   // trusted: our own drawing catalogue
  parent.appendChild(s);
  if (rough) {
    // Crop to the drawing itself so every picture fills its box, whatever its size in the catalogue.
    const bb = s.firstChild.getBBox(), pad = 28;
    s.setAttribute("viewBox", `${bb.x - pad} ${bb.y - pad} ${bb.width + 2 * pad} ${bb.height + 2 * pad}`);
  }
  return s;
}

function renderSlide(post, i) {
  const s = post.slides[i], n = post.slides.length;
  card.replaceChildren();
  card.className = "";
  svg("", "0 0 1080 1350", '<rect width="1080" height="1350" filter="url(#noise)"/>', card).id = "grain";
  el("div", "count", card).textContent = `${i + 1}/${n}`;
  el("div", "handle", card).textContent = "@soundmindwithshivani";

  if (post.format === "quotes") {
    if (s.type === "cover") {
      svg("sprig", "0 0 150 70", SPRIG, card);
      richText(card, s.text, "hand", C.fontSize(s.text, "cover"));
      svg("sprig", "0 0 150 70", SPRIG, card).style.transform = "scaleX(-1)";
      el("div", "swipe", card).textContent = "swipe →";
    } else if (s.type === "quote") {
      richText(card, s.text, "serif", C.fontSize(s.text, "quote"));
      svg("sprig", "0 0 150 70", SPRIG, card);
    }
  } else {
    if (s.type === "cover") {
      card.className = "story-cover";
      richText(card, s.title, "hand", C.fontSize(s.title, "cover"));
      el("p", "sub", card).textContent = s.subtitle;
      svg("art", "0 0 600 600", A.ART[s.art], card, true);
      el("div", "swipe", card).textContent = "swipe →";
    } else if (s.type === "page") {
      card.className = "story-page";
      svg("art", "0 0 600 600", A.ART[s.art], card, true);
      richText(card, s.text, "serif", C.fontSize(s.text, "page"));
    } else if (s.type === "lesson") {
      card.className = "lesson";
      svg("sprig", "0 0 150 70", SPRIG, card);
      richText(card, s.text, "hand", C.fontSize(s.text, "lesson"));
      svg("sprig", "0 0 150 70", SPRIG, card).style.transform = "scaleX(-1)";
    }
  }
  if (s.type === "share") {
    svg("plane", "0 0 120 120", PLANE, card);
    richText(card, s.text, "hand", C.fontSize(s.text, "share"));
  }
  return document.fonts.ready.then(() => overflow());
}

// Anything spilling out of the card, or running into the page number / handle, fails the render.
function overflow() {
  const box = card.getBoundingClientRect();
  const top = card.querySelector(".count").getBoundingClientRect().bottom + 10;
  const bottom = card.querySelector(".handle").getBoundingClientRect().top - 10;
  const bad = [];
  for (const e of card.querySelectorAll(".text, .art, .sub")) {
    const r = e.getBoundingClientRect();
    if (r.top < Math.max(box.top, top) || r.bottom > Math.min(box.bottom, bottom) || r.left < box.left || r.right > box.right) bad.push(e.className);
  }
  return bad;
}

// Wait for both fonts before the first render (Kalam and Lora, every weight we use).
const reelReady = Promise.all(["700 40px Kalam", "400 40px Kalam", "400 40px Lora", "500 40px Lora", "italic 400 40px Lora"]
  .map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => true);
</script>
</body>
</html>
