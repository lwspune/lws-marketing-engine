<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chemistry Visualised 1 Heat Rate</title>
<link rel="stylesheet" href="render.css">
</head>
<body>
<canvas id="c" aria-label="Reel preview"></canvas>
<div class="bar" id="bar"></div>
<div id="status" role="status"></div>
<script src="engine.js"></script>
<script>
// @pyqvault_ · "Chemistry, visualised #1: why does heat speed up a reaction?" (2026-10-18). Class 12, Chemical Kinetics.
// Molecules in a 3D glass jar; warm 298 K → 308 K and they move only ~1.7% faster, yet the rate doubles. Why:
// the energy distribution (Maxwell–Boltzmann, f(E) ∝ √E·e^(−E/kT)) barely shifts, but the far tail past the
// activation energy (Eₐ ≈ 21.35 kT₂₉₈, the value that makes +10 K double the rate) holds ~2× the molecules.
// The tail is ~10⁻⁹ of the curve, so it's shown in a labelled ×10⁹ zoom (honest scale), never as fake counts.
// @pyqvault_ house settings (reels/pyqvault-insta.md): no exam question on screen, short labels only, the
// end card ends with pyqvault.com. (CBSE asked this in 2023, 2025, 2026: that goes in the caption.)
// THEME is the background A/B test on @pyqvault_ (learnings L22): this one is 'white'.
const THEME = 'white';
const PAL = Reel.palette(THEME);
const { blue: BLUE, green: GREEN, ink: INK, muted: MUTED } = PAL;
const lerp = (a, b, k) => a + (b - a) * k;
const show = (api, t, t0, t1, f = 0.35) => api.prog(t, t0, f) * (1 - api.prog(t, t1 - f, f));
const tint = (hex, a) => `rgba(${[1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)).join(', ')}, ${a})`;

const HEAT0 = 12.0, GRAPH0 = 16.4, END_AT = 28.8;
const TAU = 308 / 298, XA = Math.LN2 / (1 - 298 / 308);       // Eₐ in units of kT at 298 K (≈ 21.35)
const f = (x, tau) => 2 / Math.sqrt(Math.PI) * Math.pow(tau, -1.5) * Math.sqrt(x) * Math.exp(-x / tau);
const tail = tau => { let s = 0; for (let x = XA; x < XA + 40; x += 0.01) s += f(x, tau) * 0.01; return s; };
const RATIO = tail(TAU) / tail(1);                              // ≈ 2.0

// Temperature over time (K) and the matching speed factor √(T/298).
const tempAt = (t, api) => 298 + 10 * api.prog(t, HEAT0, 2.0);

// ---- molecules: a deterministic little gas (wall bounces only), advanced step by step and cached ----
const JAR = { cx: 380, top: 700, bottom: 1260, r: 210 };
const N = 46, DT = 1 / 120;
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const P0 = Array.from({ length: N }, () => {
  const a = rnd() * 2 * Math.PI, sp = 260 + rnd() * 220;
  return { x: JAR.cx - JAR.r + 30 + rnd() * (2 * JAR.r - 60), y: JAR.top + 80 + rnd() * (JAR.bottom - JAR.top - 140), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp };
});
let cache = { t: 0, ps: P0.map(p => ({ ...p })) };
function gasAt(t, api) {
  if (t < cache.t) cache = { t: 0, ps: P0.map(p => ({ ...p })) };
  const x0 = JAR.cx - JAR.r + 14, x1 = JAR.cx + JAR.r - 14, y0 = JAR.top + 40, y1 = JAR.bottom - 14;
  while (cache.t + DT <= t) {
    const k = Math.sqrt(tempAt(cache.t, api) / 298);
    for (const p of cache.ps) {
      p.x += p.vx * k * DT; p.y += p.vy * k * DT;
      if (p.x < x0) { p.x = 2 * x0 - p.x; p.vx = -p.vx; } if (p.x > x1) { p.x = 2 * x1 - p.x; p.vx = -p.vx; }
      if (p.y < y0) { p.y = 2 * y0 - p.y; p.vy = -p.vy; } if (p.y > y1) { p.y = 2 * y1 - p.y; p.vy = -p.vy; }
    }
    cache.t += DT;
  }
  return cache.ps;
}

// ---- title: held still on a card with a light running round its edge, then it glides up ----
const TITLE_CARD = { x: 80, y: 620, w: 920, h: 360 };
function drawTitle(ctx, t, api) {
  const k = api.prog(t, 2.6, 1.0), ca = 1 - api.prog(t, 2.5, 0.5);
  if (ca > 0) {
    ctx.save(); ctx.globalAlpha = ca; api.card(TITLE_CARD.x, TITLE_CARD.y, TITLE_CARD.w, TITLE_CARD.h); ctx.restore();
    api.glowRing(t, { ...TITLE_CARD, t0: 0, dur: 2.8, laps: 1.25, alpha: ca });
  }
  const s = lerp(1, 0.72, k), cy = lerp(847, 350, k);   // 847: the title block (label + 2 lines) centred on the card
  ctx.save(); ctx.translate(540, cy); ctx.scale(s, s);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = MUTED; ctx.font = `700 46px ${api.SOFT_UI}`; ctx.fillText('CHEMISTRY, VISUALISED  #1', 0, -150);
  ctx.fillStyle = INK; ctx.font = api.hand(78);
  ctx.fillText('Why does heat speed', 0, -60); ctx.fillText('up a reaction?', 0, 40);
  ctx.restore();
}

// ---- scene 1: the jar and the thermometer ----
function thermometer(ctx, api, x, top, bottom, T) {
  const k = (T - 290) / 25, col = top + 20 + (1 - k) * (bottom - top - 60);
  ctx.save();
  ctx.fillStyle = tint(INK, 0.06); ctx.strokeStyle = tint(INK, 0.35); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(x - 18, top, 36, bottom - top, 18); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, bottom + 16, 34, 0, 7); ctx.fill(); ctx.stroke();
  api.sphere3d(x, bottom + 16, 26, GREEN);
  ctx.fillStyle = GREEN; ctx.beginPath(); ctx.roundRect(x - 9, col, 18, bottom + 10 - col, 9); ctx.fill();
  ctx.fillStyle = INK; ctx.font = api.hand(46); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(Math.round(T) + ' K', x, top - 40);
  ctx.restore();
}
function drawScene1(ctx, t, api, isCover) {
  const a = api.prog(t, 3.2, 0.6) * (1 - api.prog(t, GRAPH0 - 0.6, 0.6)); if (a <= 0) return;
  const T = tempAt(t, api), ps = gasAt(t, api), warm = (T - 298) / 10;
  ctx.save(); ctx.globalAlpha = a;
  api.jar({ ...JAR }, () => {
    if (warm > 0) { ctx.fillStyle = tint(GREEN, 0.06 * warm); ctx.fillRect(JAR.cx - JAR.r, JAR.top - 60, 2 * JAR.r, JAR.bottom - JAR.top + 120); }
    for (const p of ps) api.sphere3d(p.x, p.y, 13, BLUE);
  });
  thermometer(ctx, api, 820, 760, 1180, T);
  if (!isCover) {
    const sp = (Math.sqrt(T / 298) - 1) * 100;
    api.math(['molecules ', { text: (sp >= 0.05 ? '+' + sp.toFixed(1) : '+0.0') + '% faster', color: BLUE }, '   ·   rate ', { text: '×' + Math.pow(2, (T - 298) / 10).toFixed(2), color: GREEN }], { y: 1380, size: 44, cx: 540, color: INK });
  }
  ctx.restore();
}

// ---- scene 2: the energy distribution and its tail ----
const GR = { x0: 130, x1: 970, base: 1270, h: 380, xmax: 25 };
const gx = x => GR.x0 + (GR.x1 - GR.x0) * x / GR.xmax, gy = (y, k) => GR.base - y * k;
function curve(ctx, tau, color, upto, k, w = 5) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath();
  for (let x = 0; x <= upto; x += 0.04) { const X = gx(x), Y = gy(f(x, tau), k); x === 0 ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y); }
  ctx.stroke(); ctx.restore();
}
const INSET = { x: 300, y: 470, w: 680, h: 360, xmin: 20.5, xmax: 26 };
function drawScene2(ctx, t, api) {
  const a = api.prog(t, GRAPH0, 0.6) * (1 - api.prog(t, END_AT - 0.6, 0.6)); if (a <= 0) return;
  const K = GR.h / 0.5;                                     // y scale: the 298 K peak (≈0.48) near the top
  ctx.save(); ctx.globalAlpha = a;
  ctx.strokeStyle = PAL.axis; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(GR.x0, GR.base - GR.h - 30); ctx.lineTo(GR.x0, GR.base); ctx.lineTo(GR.x1 + 20, GR.base); ctx.stroke();
  ctx.fillStyle = MUTED; ctx.font = `600 34px ${api.SOFT_UI}`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText('energy →', GR.x1 + 20, GR.base + 36);
  ctx.save(); ctx.translate(GR.x0 - 30, GR.base - GR.h / 2); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'center'; ctx.fillText('molecules', 0, 0); ctx.restore();
  const c1 = api.prog(t, GRAPH0 + 0.8, 1.6), c2 = api.prog(t, GRAPH0 + 2.6, 1.6);
  if (c1 > 0) curve(ctx, 1, BLUE, GR.xmax * c1, K);
  if (c2 > 0) curve(ctx, TAU, GREEN, GR.xmax * c2, K, 4);
  // legend
  const lg = api.prog(t, GRAPH0 + 1.0, 0.5);
  if (lg > 0) {
    ctx.globalAlpha = a * lg; ctx.font = api.hand(40); ctx.textAlign = 'left';
    ctx.fillStyle = BLUE; ctx.fillText('298 K', gx(3.2), gy(0.40, K));
    if (c2 > 0) { ctx.fillStyle = GREEN; ctx.fillText('308 K', gx(3.2), gy(0.32, K)); }
  }
  // the energy hill
  const ea = api.prog(t, GRAPH0 + 5.0, 0.6);
  if (ea > 0) {
    ctx.globalAlpha = a * ea; ctx.save(); ctx.setLineDash([10, 10]); ctx.strokeStyle = MUTED; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(gx(XA), GR.base); ctx.lineTo(gx(XA), GR.base - GR.h); ctx.stroke(); ctx.restore();
    ctx.fillStyle = INK; ctx.font = api.hand(42); ctx.textAlign = 'center'; ctx.fillText('Eₐ', gx(XA), GR.base - GR.h - 28);
  }
  // zoom into the tail past Eₐ: ×10⁹, labelled
  const z = api.prog(t, GRAPH0 + 7.2, 0.8);
  if (z > 0) {
    ctx.globalAlpha = a * z;
    api.card(INSET.x, INSET.y, INSET.w, INSET.h, 24);
    ctx.save(); ctx.beginPath(); ctx.rect(INSET.x, INSET.y + 56, INSET.w, INSET.h - 56); ctx.clip();
    const ix = x => INSET.x + 30 + (INSET.w - 60) * (x - INSET.xmin) / (INSET.xmax - INSET.xmin);
    const KI = (INSET.h - 110) / 1.3e-8, iy = y => INSET.y + INSET.h - 40 - y * KI;
    const shade = (tau, color, fill) => {
      ctx.beginPath(); ctx.moveTo(ix(XA), iy(0));
      for (let x = XA; x <= INSET.xmax; x += 0.05) ctx.lineTo(ix(x), iy(f(x, tau)));
      ctx.lineTo(ix(INSET.xmax), iy(0)); ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
      ctx.beginPath(); for (let x = INSET.xmin; x <= INSET.xmax; x += 0.05) { x === INSET.xmin ? ctx.moveTo(ix(x), iy(f(x, tau))) : ctx.lineTo(ix(x), iy(f(x, tau))); }
      ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.stroke();
    };
    const sh = api.prog(t, GRAPH0 + 8.4, 0.8);
    shade(TAU, GREEN, tint(GREEN, 0.28 * sh)); shade(1, BLUE, tint(BLUE, 0.30 * sh));
    ctx.save(); ctx.setLineDash([8, 8]); ctx.strokeStyle = MUTED; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ix(XA), iy(0)); ctx.lineTo(ix(XA), INSET.y + 50); ctx.stroke(); ctx.restore();
    ctx.strokeStyle = PAL.axis; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(INSET.x + 24, iy(0)); ctx.lineTo(INSET.x + INSET.w - 20, iy(0)); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = MUTED; ctx.font = `600 34px ${api.SOFT_UI}`; ctx.textAlign = 'left'; ctx.fillText('tail past Eₐ, zoomed ×10⁹', INSET.x + 24, INSET.y + 34);
    // a leader from the zoom to the tail on the main graph
    ctx.strokeStyle = tint(MUTED, 0.6); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(gx(XA) + 20, GR.base - 8); ctx.lineTo(INSET.x + INSET.w * 0.55, INSET.y + INSET.h); ctx.stroke();
  }
  ctx.restore();
}

// ---- words ----
function drawWords(ctx, t, api, isCover) {
  if (isCover) return;
  const say = (a, tokens, y, size, color = INK) => { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; api.math(tokens, { y, size, cx: 540, color }); ctx.restore(); };
  say(show(api, t, 3.6, 7.8), ['molecules, colliding non-stop'], 1470, 50);
  say(show(api, t, 7.8, HEAT0), ['only the hardest hits react'], 1470, 50);
  say(show(api, t, HEAT0, GRAPH0 - 0.3), ['+10 K  →  rate ', { text: '×2', color: GREEN }], 1470, 56);
  say(show(api, t, HEAT0 + 1.6, GRAPH0 - 0.3), ['…but only 1.7% faster?'], 1550, 46, MUTED);
  say(show(api, t, GRAPH0 + 0.6, GRAPH0 + 5.0), ['298 K vs 308 K: nearly the same'], 1440, 48);
  say(show(api, t, GRAPH0 + 5.0, GRAPH0 + 7.2), ['the energy hill, ', { text: 'Eₐ', color: INK }], 1440, 50);
  say(show(api, t, GRAPH0 + 7.2, END_AT - 0.3), ['zoom past the hill'], 1440, 48);
  say(show(api, t, GRAPH0 + 8.8, END_AT - 0.3), [{ text: 'twice the climbers  →  twice the rate', color: GREEN }], 1520, 50);
}

Reel.mount({
  name: 'pv-chem-001-heat-rate',
  theme: THEME,
  vignette: true,
  size: [1080, 1920],
  duration: 32.4,
  watermarkY: null,
  captions: [],
  lines: [],
  draw(ctx, t, api, isCover) {
    drawTitle(ctx, t, api);
    drawScene1(ctx, t, api, isCover);
    drawScene2(ctx, t, api);
    drawWords(ctx, t, api, isCover);
    return null;
  },
  end: { t0: END_AT, y: 860, lines: [
    { at: 0.2, size: 48, weight: 400, color: MUTED, text: 'A little heat, twice the climbers.' },
    { at: 0.5, size: 60, weight: 600, color: INK, text: 'That\'s the chemistry.' },
    { at: 0.9, size: 44, weight: 600, color: MUTED, text: 'Follow for #2' },
    { at: 1.2, size: 80, weight: 700, color: GREEN, text: 'pyqvault.com' },
  ] },
  music: { style: 'calm' },
  // Cover: the zoomed tail, 308 K's area about twice 298 K's.
  cover: { t: 27.0, text: '+10 K = twice the rate. Why?', y: 1520, size: 56 },
});
</script>
</body>
</html>
